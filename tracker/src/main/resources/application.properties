# ---------- HikariCP: primary pool (writes) ----------
spring.datasource.hikari.pool-name=primary-pool
# Hikari's rule of thumb: (cores * 2) + disks. 10 is plenty for a single-user app.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Fail after 3s instead of the 30s default when the pool is exhausted or the DB is down.
spring.datasource.hikari.connection-timeout=3000
# Close idle connections above minimum-idle after 5 min.
spring.datasource.hikari.idle-timeout=300000
# Recycle connections every 30 min, before Postgres or a proxy drops them.
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Replica (reads) ----------
# Docker compose sets APP_DATASOURCE_REPLICA_URL. Empty (IntelliJ run against WSL) = the
# replica pool just points at the primary URL above, so local runs still work.
app.datasource.replica.url=${APP_DATASOURCE_REPLICA_URL:}
app.datasource.replica.hikari.pool-name=replica-pool
app.datasource.replica.hikari.maximum-pool-size=10
app.datasource.replica.hikari.minimum-idle=2
app.datasource.replica.hikari.connection-timeout=3000
app.datasource.replica.hikari.idle-timeout=300000
app.datasource.replica.hikari.max-lifetime=1800000
# The driver refuses writes on these connections even if routing were wrong.
app.datasource.replica.hikari.read-only=true
app.datasource.replica.hikari.data-source-properties.ssl=false
app.datasource.replica.hikari.data-source-properties.sslmode=disable

# ---------- LLM weekly insight ----------
# Empty key = rule-based fallback text, so the endpoint still works without a key (dev, CI).
app.llm.api-key=${ANTHROPIC_API_KEY:}
app.llm.model=claude-opus-5-5