# Serves the built UI and forwards /logs to the backend container,
# so the browser only ever talks to one origin (same idea as the Vite dev proxy).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /logs {
    proxy_pass http://host.containers.internal:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
